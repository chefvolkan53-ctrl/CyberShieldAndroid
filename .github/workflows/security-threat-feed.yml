name: CyberShield Security Threat Feed

on:
  schedule:
    - cron: "17 02 * * *"
  workflow_dispatch:

concurrency:
  group: security-threat-feed-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build threat intelligence feed
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
          PHISHTANK_APP_KEY: ${{ secrets.PHISHTANK_APP_KEY }}
        run: |
          set -euo pipefail
          python tools/build_threat_intel_feed.py --output security-updates/threat_intel.json

      - name: Upload unsigned feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-threat-intel-feed
          path: security-updates/threat_intel.json
          if-no-files-found: error
          retention-days: 1

  sign-and-publish:
    needs: build-feed
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: security-update-signing
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download unsigned feed artifact
        uses: actions/download-artifact@v4
        with:
          name: unsigned-threat-intel-feed
          path: security-updates

      - name: Sign feed and build manifest
        env:
          CYBERSHIELD_UPDATE_PRIVATE_KEY: ${{ secrets.CYBERSHIELD_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$CYBERSHIELD_UPDATE_PRIVATE_KEY"
          umask 077
          printf '%s\n' "$CYBERSHIELD_UPDATE_PRIVATE_KEY" > /tmp/cybershield_update_private_key.pem
          trap 'rm -f /tmp/cybershield_update_private_key.pem' EXIT
          java tools/SignSecurityUpdatePackage.java security-updates/threat_intel.json /tmp/cybershield_update_private_key.pem > security-updates/threat_intel_signature.json
          python tools/build_update_manifest.py \
            --feed security-updates/threat_intel.json \
            --signature security-updates/threat_intel_signature.json \
            --repo "$GITHUB_REPOSITORY" \
            --branch "${GITHUB_REF_NAME:-main}" \
            --output security-updates/model_update_manifest.json
          rm -f /tmp/cybershield_update_private_key.pem

      - name: Commit feed update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security-updates/threat_intel.json security-updates/threat_intel_signature.json security-updates/model_update_manifest.json
          if git diff --cached --quiet; then
            echo "No threat intelligence changes."
          else
            git commit -m "Update CyberShield threat intelligence feed"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            git push
          fi
