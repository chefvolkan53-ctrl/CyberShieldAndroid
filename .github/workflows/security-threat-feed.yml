name: CyberShield Security Threat Feed

on:
  schedule:
    - cron: "17 02 * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: security-threat-feed-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate model calibration gate
        run: |
          set -euo pipefail
          python tools/validate_model_calibration.py --repo .

      - name: Build threat intelligence feed
        env:
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
          PHISHTANK_APP_KEY: ${{ secrets.PHISHTANK_APP_KEY }}
        run: |
          set -euo pipefail
          python tools/build_threat_intel_feed.py --output security-updates/threat_intel.json

      - name: Upload unsigned feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-threat-intel-feed
          path: security-updates/threat_intel.json
          if-no-files-found: error
          retention-days: 1

  sign-and-publish:
    needs: build-feed
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: security-update-signing
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download unsigned feed artifact
        uses: actions/download-artifact@v4
        with:
          name: unsigned-threat-intel-feed
          path: security-updates

      - name: Sign feed and build manifest
        env:
          CYBERSHIELD_UPDATE_PRIVATE_KEY: ${{ secrets.CYBERSHIELD_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$CYBERSHIELD_UPDATE_PRIVATE_KEY"
          umask 077
          printf '%s\n' "$CYBERSHIELD_UPDATE_PRIVATE_KEY" > /tmp/cybershield_update_private_key.pem
          trap 'rm -f /tmp/cybershield_update_private_key.pem' EXIT
          java tools/SignSecurityUpdatePackage.java security-updates/threat_intel.json /tmp/cybershield_update_private_key.pem > security-updates/threat_intel_signature.json
          python tools/build_update_manifest.py \
            --feed security-updates/threat_intel.json \
            --signature security-updates/threat_intel_signature.json \
            --repo "$GITHUB_REPOSITORY" \
            --branch "${GITHUB_REF_NAME:-main}" \
            --output security-updates/model_update_manifest.json
          rm -f /tmp/cybershield_update_private_key.pem

      - name: Publish feed update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_branch="${GITHUB_REF_NAME:-main}"
          update_branch="security-updates/threat-intel-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$update_branch"
          git add security-updates/threat_intel.json security-updates/threat_intel_signature.json security-updates/model_update_manifest.json
          if git diff --cached --quiet; then
            echo "No threat intelligence changes."
          else
            git commit -m "Update CyberShield threat intelligence feed"
            git push --force-with-lease origin "$update_branch"
            head_sha="$(git rev-parse HEAD)"
            python - <<'PY' > /tmp/cybershield_status.json
import json

print(json.dumps({
    "state": "success",
    "context": "build-feed",
    "description": "Threat feed built and signed by protected workflow",
    "target_url": f"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
}))
PY
            curl -sSf \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
              -d @/tmp/cybershield_status.json
            python - <<PY > /tmp/cybershield_pr.json
import json

print(json.dumps({
    "title": "Update CyberShield threat intelligence feed",
    "head": "${update_branch}",
    "base": "${base_branch}",
    "body": (
        "Automated signed CyberShield threat intelligence update.\\n\\n"
        "- Built by the read-only feed job.\\n"
        "- Signed inside the protected security-update-signing environment.\\n"
        "- Requires branch protection review before reaching main."
    ),
    "maintainer_can_modify": True
}))
PY
            curl -sSf \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" \
              -d @/tmp/cybershield_pr.json
          fi
