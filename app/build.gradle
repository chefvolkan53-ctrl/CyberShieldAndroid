plugins {
    id "com.android.application"
}

def releaseSigningProps = new Properties()
def releaseSigningPropsPath = System.getenv("CYBERSHIELD_RELEASE_PROPS")
def releaseSigningPropsFile = releaseSigningPropsPath != null && !releaseSigningPropsPath.trim().isEmpty()
        ? file(releaseSigningPropsPath)
        : file(System.properties["user.home"] + "/.android/cybershield-release.properties")
if (releaseSigningPropsFile.exists()) {
    releaseSigningPropsFile.withInputStream { releaseSigningProps.load(it) }
}

def releaseStoreFile = System.getenv("CYBERSHIELD_KEYSTORE") ?: releaseSigningProps.getProperty("storeFile")
def releaseStorePassword = System.getenv("CYBERSHIELD_KEYSTORE_PASSWORD") ?: releaseSigningProps.getProperty("storePassword")
def releaseKeyAlias = System.getenv("CYBERSHIELD_KEY_ALIAS") ?: releaseSigningProps.getProperty("keyAlias")
def releaseKeyPassword = System.getenv("CYBERSHIELD_KEY_PASSWORD") ?: releaseSigningProps.getProperty("keyPassword")
def hasReleaseSigning = releaseStoreFile != null && releaseStorePassword != null && releaseKeyAlias != null && releaseKeyPassword != null

android {
    namespace "com.monster.cybershield"
    compileSdk 35

    defaultConfig {
        applicationId "com.monster.cybershield"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    aaptOptions {
        noCompress "tflite"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "org.tensorflow:tensorflow-lite:2.17.0"
}
